<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EDU AI</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f2f3f7;--card:#fff;--text:#25262b;--sub:#747a88;--line:#e1e4ec;--purple:#6843eb;--purple2:#7e38f2;--soft:#f8f9fc;--green:#218b5a;--red:#c94b55;font-family:"서초바탕","SeochoBatang","AppleMyungjo","Noto Serif KR","Batang",serif;font-synthesis:none}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{text-align:center}button,input,select,textarea{font:inherit}button,label{cursor:pointer}.hidden{display:none!important}
.shell{width:min(860px,calc(100% - 24px));margin:auto;padding:20px 0 110px}.hero{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;border-radius:24px;padding:28px 20px 24px;box-shadow:0 16px 40px rgba(101,68,225,.2)}.hero h1{font-size:45px;letter-spacing:-.05em;margin:0}.hero p{font-size:14px;line-height:1.65;color:#f0ecff;margin:11px auto 18px;max-width:590px}.hero button{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.15);color:#fff;border-radius:999px;padding:10px 20px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 7px 24px rgba(33,40,55,.04);margin-bottom:14px}.card h2{margin:0 0 14px;font-size:24px;letter-spacing:-.03em}.kicker{font-size:11px;color:#9298a5;letter-spacing:.12em;margin-bottom:5px}.center{text-align:center}.left,.left *{text-align:left!important}
.upload-btn,.primary,.soft-btn,.web-btn,.danger-btn{border:0;border-radius:12px;padding:10px 15px;font-weight:700}.upload-btn,.primary{background:linear-gradient(135deg,var(--purple),var(--purple2));color:white}.soft-btn{background:#eef0f4;color:#5f6673}.web-btn{background:#eaf7f1;color:var(--green);border:1px solid #cdebdc}.danger-btn{background:#fff0f1;color:var(--red);border:1px solid #f3d1d5}.primary:disabled,.web-btn:disabled,.danger-btn:disabled,.soft-btn:disabled{opacity:.45;cursor:not-allowed}.status{min-height:18px;margin-top:8px;color:#7f8591;font-size:12px;line-height:1.5}.status.error{color:var(--red)}.status.ok{color:var(--green)}
.list{display:grid;gap:8px}.empty{color:#9aa0ab;padding:16px 4px;line-height:1.55}.material{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #edf0f4}.material:last-child{border-bottom:0}.material .name{border:0;background:none;font-weight:700;text-align:left;color:var(--text);padding:4px}.material input[type=checkbox]{width:18px;height:18px}.badge{font-size:10px;background:#f0f1f5;border-radius:999px;padding:4px 7px;color:#737987;white-space:nowrap}.row-actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:12px}.row-actions button{padding:8px 11px}.mini-danger{border:0;border-radius:9px;background:#fff0f1;color:var(--red);padding:7px 9px;font-weight:700}
.settings{display:grid;gap:10px}.settings label{display:grid;gap:6px;font-size:13px;font-weight:700;color:#555c69}.settings label span{text-align:center}.range{display:grid;grid-template-columns:1fr 44px;align-items:center;gap:7px}.range em{font-style:normal;color:var(--purple)}input,select,textarea{width:100%;border:1px solid #d9deea;background:#fbfcff;border-radius:11px;padding:10px 11px;color:var(--text)}select,input[type=number],input[type=text]{text-align:center;text-align-last:center}input[type=range]{padding:0;accent-color:var(--purple)}.scope-input{min-height:86px;text-align:center;resize:vertical}.study-answer{min-height:110px;resize:vertical;text-align:left}.research-box{margin-top:12px;padding:13px;border-radius:13px;background:#f4fbf8;border:1px solid #d8eee4;font-size:12px;line-height:1.6}.research-box h3{font-size:15px;margin:0 0 7px}.source-list{display:grid;gap:6px;margin-top:9px}.source-list a{color:#3866aa;word-break:break-all;text-decoration:none}.full{margin-top:14px}.study-title,.study-title h2{text-align:left}.quiz{display:grid;gap:13px}.qcard{background:#fafbfe;border:1px solid #eceff4;border-radius:15px;padding:16px;text-align:left}.qcard h3{font-size:17px;line-height:1.55;margin:0 0 5px}.muted{font-size:12px;color:var(--sub)}.origin{display:inline-block;margin:3px 0 7px;padding:4px 7px;border-radius:999px;background:#eeeaff;color:#6556a9;font-size:10px}.choice{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #edf0f4}.choice input{width:auto;margin-top:4px}.result{line-height:1.65}.score{font-size:46px;font-weight:800;color:var(--purple);margin:4px 0 14px}.feedback{padding:12px 0;border-top:1px solid #eceff4}.feedback-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.feedback-box{background:var(--soft);border:1px solid #eceff4;border-radius:15px;padding:14px}.feedback-box h3{margin:0 0 8px;font-size:16px}.mastery{display:grid;grid-template-columns:105px 1fr 42px;gap:9px;align-items:center;padding:7px 0}.bar{height:8px;background:#e9ebf0;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--purple),#9b83f6)}
.workspace{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.preview{min-height:390px;background:#eef0f4;border-radius:13px;overflow:hidden}.preview img,.preview iframe{display:block;width:100%;height:56vh;min-height:390px;border:0;object-fit:contain}.note{line-height:1.72}.note h2{font-size:23px}.note h3{font-size:16px;margin:22px 0 7px}.note ul{padding-left:20px}.note-box{background:#fafbfe;border:1px solid #eceff4;border-radius:11px;padding:11px;margin:8px 0}.workspace-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.workspace-head h2{margin:0;text-align:left}.backend-pill{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.14);font-size:11px;color:#f4efff}
.bottom{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(830px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:19px;padding:7px;box-shadow:0 12px 35px rgba(25,30,42,.13);backdrop-filter:blur(14px)}.bottom button{border:0;background:transparent;color:#757b87;padding:10px 5px;border-radius:13px;font-weight:700}.bottom button.active{background:#eeeaff;color:var(--purple)}
@media(max-width:700px){.shell{width:calc(100% - 18px);padding-top:10px}.hero{border-radius:20px;padding:24px 16px 21px}.hero h1{font-size:38px}.grid2,.workspace,.feedback-grid{grid-template-columns:1fr}.card{border-radius:18px;padding:16px}.preview img,.preview iframe{height:45vh;min-height:300px}.material{grid-template-columns:auto 1fr auto}}
</style>
</head>
<body>
<div class="shell">
<header class="hero"><h1>EDU AI</h1><p>학습자료 + 시험범위 웹 분석 + AI 문제 생성 + 오답 분석</p><button id="startBtn">학습 시작</button><div id="backendState" class="backend-pill">서버 확인 중…</div></header>
<section id="home">
<div class="grid2">
<section class="card center"><div class="kicker">자료</div><h2>자료</h2><label class="upload-btn" for="file1">+ 자료 추가</label><input id="file1" type="file" hidden accept="image/*,.pdf,application/pdf"><div id="uploadStatus" class="status"></div><div id="recentMaterials" class="list empty">아직 자료가 없다.</div><button id="allMaterialsBtn" class="soft-btn">전체 자료 보기</button></section>
<section class="card center"><div class="kicker">문제 설정</div><h2>문제 설정</h2><div class="settings"><label><span>업로드 자료</span><select id="quizMaterial"></select></label><label><span>학년</span><select id="grade"><option>중1</option><option>중2</option><option>중3</option><option selected>고1</option><option>고2</option><option>고3</option></select></label><label><span>과목</span><input id="subject" type="text" placeholder="예: 공통수학1"></label><label><span>시험범위</span><textarea id="scope" class="scope-input" placeholder="예: 집합, 명제"></textarea></label><button id="researchBtn" class="web-btn">🌐 공개 기출·모의고사 경향 분석</button><div id="researchStatus" class="status"></div><div id="researchResult" class="research-box hidden"></div><label><span>문제 수</span><input id="quizCount" type="number" min="1" max="30" value="10"></label><label><span>객관식 비율</span><div class="range"><input id="mcqPercent" type="range" min="0" max="100" step="10" value="70"><em id="mcqLabel">70%</em></div></label><label><span>난이도</span><select id="difficulty"><option value="mixed">혼합</option><option value="easy">쉬움</option><option value="normal">보통</option><option value="hard">어려움</option></select></label></div><div style="margin-top:14px"><button id="generateQuiz" class="primary">문제 생성</button></div><div id="quizStatus" class="status"></div></section>
</div>
<section id="quizSection" class="card full left"><div class="kicker">문제 및 오답노트</div><div class="study-title"><h2>문제 및 오답노트</h2></div><form id="quizForm" class="quiz hidden"></form><div id="resultPanel" class="result empty left">생성된 문제가 여기에 표시된다.<br>채점 후 틀린 문제와 해설도 여기서 확인한다.</div></section>
<section id="feedbackSection" class="card full center"><div class="kicker">피드백</div><h2>피드백</h2><div class="feedback-grid"><div class="feedback-box center"><h3>취약 개념</h3><div id="weakConcepts" class="list empty center">문제를 풀면 분석된다.</div></div><div class="feedback-box center"><h3>개념 숙련도</h3><div id="masteryList" class="list empty center">아직 분석 데이터가 없다.</div></div></div></section>
</section>
<section id="materialsPage" class="hidden"><section class="card center"><div class="kicker">자료</div><h2>내 자료</h2><label class="upload-btn" for="file2">+ 자료 추가</label><input id="file2" type="file" hidden accept="image/*,.pdf,application/pdf"><div id="materialsStatus" class="status"></div><div id="materialsList" class="list empty">자료가 없다.</div><div class="row-actions"><button id="deleteSelectedBtn" class="danger-btn" disabled>선택 삭제</button><button id="deleteAllBtn" class="danger-btn" disabled>전체 삭제</button></div></section>
<div id="workspace" class="workspace hidden"><section class="card center"><div class="kicker">원본</div><h2>자료 보기</h2><div id="selectedFilename" class="muted"></div><div id="preview" class="preview"></div></section><section class="card left"><div class="workspace-head"><div><div class="kicker">요약 노트</div><h2>AI 요약</h2></div><div style="display:flex;gap:7px"><button id="analyzeBtn" class="primary">AI 자료 분석</button><button id="deleteCurrentBtn" class="danger-btn">삭제</button></div></div><div id="analyzeStatus" class="status left"></div><div id="note" class="note empty left">자료를 선택하고 AI 자료 분석을 눌러라.</div></section></div></section>
</div>
<nav class="bottom"><button class="active" data-nav="home">홈</button><button data-nav="materials">자료</button><button data-nav="quiz">문제</button><button data-nav="analysis">분석</button></nav>
<script>
const API_DEFAULT="https://examine-tester-engine.onrender.com";
const API_BASE=(localStorage.getItem("edu_ai_api_base")||API_DEFAULT).replace(/\/$/,"");
let materials=[],selectedMaterial=null,currentQuiz=null,currentResearch=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const apiUrl=p=>`${API_BASE}${p}`;
function friendlyError(raw){const s=String(raw||"");if(s.includes("RESOURCE_EXHAUSTED")||s.includes("429")||s.toLowerCase().includes("quota"))return "Gemini 사용량 제한에 도달했습니다. 잠시 후 다시 시도해주세요.";if(s.includes("Failed to fetch"))return "Render 서버에 연결하지 못했습니다. 잠시 후 다시 시도해주세요.";return s.replace(/^Error:\s*/,"")||"알 수 없는 오류가 발생했습니다."}
async function api(path,opt={}){let r;try{r=await fetch(apiUrl(path),opt)}catch(e){throw new Error(friendlyError(e.message))}let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(friendlyError(d?.detail||`HTTP ${r.status}`));return d}
function status(id,msg,type=""){const el=$(id);el.textContent=msg;el.className=`status ${type}`.trim()}
function setNav(n){document.querySelectorAll("[data-nav]").forEach(b=>b.classList.toggle("active",b.dataset.nav===n))}
function showHome(){$("home").classList.remove("hidden");$("materialsPage").classList.add("hidden");setNav("home");scrollTo({top:0,behavior:"smooth"})}
function showMaterials(){$("home").classList.add("hidden");$("materialsPage").classList.remove("hidden");setNav("materials");renderMaterials();scrollTo({top:0,behavior:"smooth"})}
async function checkBackend(){try{const h=await api("/api/health");$("backendState").textContent=`서버 연결됨 · ${h.version} · ${h.ai_provider}`;$("backendState").style.background="rgba(33,139,90,.25)"}catch(e){$("backendState").textContent="서버 연결 실패";$("backendState").style.background="rgba(201,75,85,.25)"}}
async function loadMaterials(){try{materials=await api("/api/materials");renderRecent();renderMaterials();renderQuizMaterial()}catch(e){status("uploadStatus",friendlyError(e.message),"error")}}
function renderRecent(){const box=$("recentMaterials");if(!materials.length){box.className="list empty";box.textContent="아직 자료가 없다.";return}box.className="list";box.innerHTML=materials.slice(0,3).map(m=>`<div class="material"><span></span><button class="name" data-open="${m.id}">${esc(m.filename)}</button><span class="badge">${m.status==="ready"?"분석됨":"업로드됨"}</span></div>`).join("");box.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openMaterial(+b.dataset.open))}
function renderMaterials(){const box=$("materialsList");const delSel=$("deleteSelectedBtn"),delAll=$("deleteAllBtn");if(!materials.length){box.className="list empty";box.textContent="자료가 없다.";delSel.disabled=true;delAll.disabled=true;return}box.className="list";box.innerHTML=materials.map(m=>`<div class="material"><input class="material-check" type="checkbox" value="${m.id}" aria-label="${esc(m.filename)} 선택"><button class="name" data-open="${m.id}">${esc(m.filename)}</button><div><span class="badge">${m.status==="ready"?"분석됨":"업로드됨"}</span> <button class="mini-danger" data-delete="${m.id}">삭제</button></div></div>`).join("");box.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openMaterial(+b.dataset.open));box.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>deleteOne(+b.dataset.delete));box.querySelectorAll(".material-check").forEach(c=>c.onchange=()=>{delSel.disabled=!document.querySelector(".material-check:checked")});delAll.disabled=false;delSel.disabled=true}
function renderQuizMaterial(){const sel=$("quizMaterial");const keep=sel.value;sel.innerHTML=`<option value="">자료 선택 안 함</option>`+materials.map(m=>`<option value="${m.id}">${esc(m.filename)}${m.status==="ready"?" · 분석완료":" · 분석필요"}</option>`).join("");if([...sel.options].some(o=>o.value===keep))sel.value=keep}
async function upload(file){if(!file)return;const fd=new FormData();fd.append("file",file);status("uploadStatus","업로드 중…");status("materialsStatus","업로드 중…");try{const m=await api("/api/materials",{method:"POST",body:fd});status("uploadStatus",`${m.filename} 업로드 완료`,"ok");status("materialsStatus",`${m.filename} 업로드 완료`,"ok");await loadMaterials();await openMaterial(m.id)}catch(e){status("uploadStatus",friendlyError(e.message),"error");status("materialsStatus",friendlyError(e.message),"error")}}
async function openMaterial(id){showMaterials();try{const m=await api(`/api/materials/${id}`);selectedMaterial=m;$("workspace").classList.remove("hidden");$("selectedFilename").textContent=m.filename;const url=apiUrl(`/api/materials/${id}/file`);$("preview").innerHTML=m.mime_type==="application/pdf"?`<iframe src="${url}" title="${esc(m.filename)}"></iframe>`:`<img src="${url}" alt="${esc(m.filename)}">`;renderNote(m.summary);status("analyzeStatus",m.status==="ready"?"이미 분석된 자료입니다.":"")}catch(e){status("materialsStatus",friendlyError(e.message),"error")}}
function renderNote(n){const box=$("note");if(!n){box.className="note empty left";box.textContent="아직 분석되지 않았다. AI 자료 분석을 눌러라.";return}const list=(title,a,fn=x=>esc(x))=>Array.isArray(a)&&a.length?`<h3>${title}</h3><ul>${a.map(x=>`<li>${fn(x)}</li>`).join("")}</ul>`:"";box.className="note left";box.innerHTML=`<h2>${esc(n.title||"요약 노트")}</h2><div class="muted">${esc([n.subject,n.chapter].filter(Boolean).join(" · "))}</div><div class="note-box">${esc(n.summary||"").replaceAll("\n","<br>")}</div>${list("핵심 개념",n.key_points)}${list("공식·법칙",n.formulas,x=>`<b>${esc(x.name||"")}</b> ${esc(x.expression||"")} — ${esc(x.meaning||"")}`)}${list("용어",n.terms,x=>`<b>${esc(x.term||"")}</b> — ${esc(x.definition||"")}`)}${list("시험 주의점",n.study_tips)}`}
async function analyzeCurrent(){if(!selectedMaterial)return;$("analyzeBtn").disabled=true;status("analyzeStatus","AI가 자료를 분석 중입니다…");try{const n=await api(`/api/materials/${selectedMaterial.id}/analyze`,{method:"POST"});renderNote(n);status("analyzeStatus","자료 분석 완료","ok");await loadMaterials();selectedMaterial=await api(`/api/materials/${selectedMaterial.id}`)}catch(e){status("analyzeStatus",friendlyError(e.message),"error")}finally{$("analyzeBtn").disabled=false}}
async function deleteIds(ids){for(const id of ids)await api(`/api/materials/${id}`,{method:"DELETE"});if(selectedMaterial&&ids.includes(selectedMaterial.id)){selectedMaterial=null;$("workspace").classList.add("hidden")}await loadMaterials();status("materialsStatus",`${ids.length}개 자료를 삭제했습니다.`,"ok")}
async function deleteOne(id){const m=materials.find(x=>x.id===id);if(!confirm(`'${m?.filename||"이 자료"}'를 삭제할까?\n분석 요약도 함께 삭제되지만 기존 문제·오답 기록은 유지됩니다.`))return;try{await deleteIds([id])}catch(e){status("materialsStatus",friendlyError(e.message),"error")}}
async function deleteSelected(){const ids=[...document.querySelectorAll(".material-check:checked")].map(x=>+x.value);if(!ids.length)return;if(!confirm(`선택한 ${ids.length}개 자료를 삭제할까?`))return;try{await deleteIds(ids)}catch(e){status("materialsStatus",friendlyError(e.message),"error")}}
async function deleteAll(){if(!materials.length)return;if(!confirm(`전체 자료 ${materials.length}개를 모두 삭제할까?\n이 작업은 되돌릴 수 없습니다.`))return;try{await deleteIds(materials.map(x=>x.id))}catch(e){status("materialsStatus",friendlyError(e.message),"error")}}
async function research(){const subject=$("subject").value.trim(),scope=$("scope").value.trim();if(!subject||!scope){status("researchStatus","과목과 시험범위를 먼저 입력하세요.","error");return}$("researchBtn").disabled=true;status("researchStatus","공개 자료를 검색해 출제 경향을 분석 중…");try{currentResearch=await api("/api/research",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({grade:$("grade").value,subject,scope})});renderResearch(currentResearch);status("researchStatus","경향 분석 완료","ok")}catch(e){status("researchStatus",friendlyError(e.message),"error")}finally{$("researchBtn").disabled=false}}
function renderResearch(r){const box=$("researchResult");box.classList.remove("hidden");const cs=(r.important_concepts||[]).map(x=>`<li><b>${esc(x.concept)}</b> — ${esc(x.reason||"")}</li>`).join("");const ps=(r.patterns||[]).map(x=>`<li><b>${esc(x.name)}</b> — ${esc(x.description||"")}</li>`).join("");const src=(r.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a>`).join("");box.innerHTML=`<h3>분석 결과</h3><div>${esc(r.summary||"")}</div>${cs?`<h3>중요 개념</h3><ul class="left">${cs}</ul>`:""}${ps?`<h3>출제 유형</h3><ul class="left">${ps}</ul>`:""}${src?`<h3>확인한 출처</h3><div class="source-list">${src}</div>`:""}`}
async function generateQuiz(){const materialId=Number($("quizMaterial").value)||null;if(!materialId&&!currentResearch){status("quizStatus","분석된 자료를 선택하거나 시험범위 경향 분석을 먼저 실행하세요.","error");return}$("generateQuiz").disabled=true;status("quizStatus","문제를 생성 중…");try{currentQuiz=await api("/api/quizzes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({material_id:materialId,research_id:currentResearch?.research_id||null,count:+$("quizCount").value,mcq_percent:+$("mcqPercent").value,difficulty:$("difficulty").value})});renderQuiz(currentQuiz);status("quizStatus","문제 생성 완료","ok");$("quizSection").scrollIntoView({behavior:"smooth"})}catch(e){status("quizStatus",friendlyError(e.message),"error")}finally{$("generateQuiz").disabled=false}}
function renderQuiz(q){const form=$("quizForm");form.classList.remove("hidden");$("resultPanel").className="result empty left";$("resultPanel").innerHTML="문제를 모두 푼 뒤 채점하세요.";form.innerHTML=(q.questions||[]).map((x,i)=>`<section class="qcard"><span class="origin">${esc(x.origin||"AI 신규")}</span><h3>${i+1}. ${esc(x.question)}</h3><div class="muted">${esc(x.concept||"")} · 난이도 ${esc(x.difficulty||"")}</div>${x.type==="multiple_choice"?(x.choices||[]).map((c,j)=>`<label class="choice"><input type="radio" name="${esc(x.id)}" value="${j}"><span>${j+1}. ${esc(c)}</span></label>`).join(""):`<textarea class="study-answer" name="${esc(x.id)}" placeholder="답안을 입력하세요."></textarea>`}</section>`).join("")+`<button class="primary" type="submit">채점하기</button>`}
async function gradeQuiz(e){e.preventDefault();if(!currentQuiz)return;const fd=new FormData(e.currentTarget),answers={};for(const q of currentQuiz.questions){answers[q.id]=fd.get(q.id)??""}const btn=e.currentTarget.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="채점 중…";try{const r=await api("/api/quizzes/grade",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({quiz_id:currentQuiz.quiz_id,answers})});renderGrade(r);await loadMastery()}catch(e2){$("resultPanel").className="result left";$("resultPanel").textContent=friendlyError(e2.message)}finally{btn.disabled=false;btn.textContent="채점하기"}}
function renderGrade(r){const box=$("resultPanel");box.className="result left";const wrong=(r.results||[]).filter(x=>!x.correct);box.innerHTML=`<div class="score">${r.percentage}점</div>`+(wrong.length?wrong.map((x,i)=>`<div class="feedback"><b>${esc(x.id)} · ${esc(x.concept)}</b><br><span>${esc(x.error_type||"오답")}</span><br>${esc(x.feedback||"")}<br><b>해설:</b> ${esc(x.explanation||"")}</div>`).join(""):`<div class="note-box">전부 정답입니다.</div>`);$("weakConcepts").className="list center";$("weakConcepts").innerHTML=wrong.length?[...new Set(wrong.map(x=>x.concept))].map(c=>`<div>${esc(c)}</div>`).join(""):"취약 개념 없음"}
async function loadMastery(){try{const rows=await api("/api/mastery");const box=$("masteryList");if(!rows.length){box.className="list empty center";box.textContent="아직 분석 데이터가 없다.";return}box.className="list";box.innerHTML=rows.slice(0,10).map(x=>{const p=Math.round(Number(x.score||0)*100);return `<div class="mastery"><span>${esc(x.concept)}</span><span class="bar"><i style="--w:${p}%"></i></span><b>${p}%</b></div>`}).join("")}catch{}}
$("startBtn").onclick=()=>$("quizSection").scrollIntoView({behavior:"smooth"});$("allMaterialsBtn").onclick=showMaterials;$("file1").onchange=e=>upload(e.target.files[0]);$("file2").onchange=e=>upload(e.target.files[0]);$("analyzeBtn").onclick=analyzeCurrent;$("deleteCurrentBtn").onclick=()=>selectedMaterial&&deleteOne(selectedMaterial.id);$("deleteSelectedBtn").onclick=deleteSelected;$("deleteAllBtn").onclick=deleteAll;$("researchBtn").onclick=research;$("generateQuiz").onclick=generateQuiz;$("quizForm").onsubmit=gradeQuiz;$("mcqPercent").oninput=e=>$("mcqLabel").textContent=`${e.target.value}%`;
document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{const n=b.dataset.nav;if(n==="materials")showMaterials();else{showHome();if(n==="quiz")$("quizSection").scrollIntoView({behavior:"smooth"});if(n==="analysis")$("feedbackSection").scrollIntoView({behavior:"smooth"});setNav(n)}});
checkBackend();loadMaterials();loadMastery();
</script>
</body>
</html>
