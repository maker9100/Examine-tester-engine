<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDU AI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">EDU AI</div>
    <nav class="tabs">
      <button class="tab active" data-view="home">홈</button>
      <button class="tab" data-view="materials">자료</button>
      <button class="tab" data-view="quiz">문제</button>
      <button class="tab" data-view="analysis">분석</button>
    </nav>
    <span id="modeBadge" class="mode">연결 확인 중</span>
  </header>

  <main class="content">
    <section id="homeView" class="view">
      <div class="intro">
        <div>
          <p class="eyebrow">EDU AI</p>
          <h1>자료를 올리면,<br>공부할 형태로 바꿔준다.</h1>
          <p class="desc">요약 → 문제 → 채점 → 취약점 분석</p>
        </div>
        <button id="goUpload" class="primary large">자료 추가</button>
      </div>

      <div class="home-grid">
        <section class="card">
          <div class="card-head">
            <h2>최근 자료</h2>
            <button class="text-btn" data-go="materials">전체 보기</button>
          </div>
          <div id="recentMaterials" class="empty">아직 자료가 없다.</div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2>취약 개념</h2>
            <button class="text-btn" data-go="analysis">분석 보기</button>
          </div>
          <div id="weakConcepts" class="empty">문제를 풀면 분석된다.</div>
        </section>
      </div>
    </section>

    <section id="materialsView" class="view hidden">
      <div class="section-head">
        <div>
          <h1>자료</h1>
          <p>PDF 또는 이미지를 추가해라.</p>
        </div>
        <label class="primary" for="fileInput">+ 자료 추가</label>
        <input id="fileInput" type="file" hidden accept="image/*,.pdf,application/pdf">
      </div>

      <div id="uploadStatus" class="status"></div>

      <section class="card">
        <div id="materialsList" class="empty">자료가 없다.</div>
      </section>

      <div id="workspace" class="split hidden">
        <section class="card">
          <div class="card-head">
            <div>
              <h2>원본</h2>
              <p id="selectedFilename" class="sub"></p>
            </div>
          </div>
          <div id="preview" class="preview"></div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2>요약 노트</h2>
            <button id="analyzeBtn" class="primary small">AI 분석</button>
          </div>
          <div id="note" class="note empty">자료를 선택하고 AI 분석을 눌러라.</div>
        </section>
      </div>
    </section>

    <section id="quizView" class="view hidden">
      <div class="section-head">
        <div>
          <h1>문제 만들기</h1>
          <p>분석한 자료에서 바로 출제한다.</p>
        </div>
      </div>

      <section class="card quiz-builder">
        <div class="controls">
          <label>자료
            <select id="quizMaterial"></select>
          </label>
          <label>문제 수
            <input id="quizCount" type="number" min="1" max="30" value="10">
          </label>
          <label>객관식
            <div class="range-row">
              <input id="mcqPercent" type="range" min="0" max="100" step="10" value="70">
              <span id="mcqLabel">70%</span>
            </div>
          </label>
          <label>난이도
            <select id="difficulty">
              <option value="mixed">혼합</option>
              <option value="easy">쉬움</option>
              <option value="normal">보통</option>
              <option value="hard">어려움</option>
            </select>
          </label>
        </div>
        <div class="builder-footer">
          <span id="quizStatus" class="status"></span>
          <button id="generateQuiz" class="primary">문제 생성</button>
        </div>
      </section>

      <form id="quizForm" class="quiz-stack hidden"></form>
      <div id="resultPanel" class="card hidden"></div>
    </section>

    <section id="analysisView" class="view hidden">
      <div class="section-head">
        <div>
          <h1>학습 분석</h1>
          <p>낮은 점수부터 다시 보면 된다.</p>
        </div>
      </div>
      <section class="card">
        <div id="masteryList" class="empty">아직 분석 데이터가 없다.</div>
      </section>
    </section>
  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
