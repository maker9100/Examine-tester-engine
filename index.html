<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDU AI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-shell">

    <header class="hero-card ui-center">
      <div class="hero-title">EDU AI</div>
      <div class="hero-subtitle">
        학습자료를 요약하고 문제를 만들고 오답을 분석하는 AI 학습 도구
      </div>
      <button id="goUpload" class="start-btn">학습 시작</button>
    </header>

    <main class="main-stack">

      <section id="homeView" class="view">

        <div class="grid-two">

          <section class="panel compact ui-center">
            <div class="panel-head centered-head">
              <div>
                <div class="section-kicker">자료</div>
                <h2>자료</h2>
              </div>
            </div>

            <div class="mini-actions centered-actions">
              <label class="upload-chip" for="fileInput">+ 자료 추가</label>
              <input id="fileInput" hidden type="file" accept="image/*,.pdf,application/pdf">
            </div>

            <div id="uploadStatus" class="status"></div>

            <div id="recentMaterials" class="simple-list empty ui-center">
              아직 자료가 없다.
            </div>

            <button class="ghost-btn center-button" data-action="open-materials">전체 자료 보기</button>
          </section>

          <section class="panel compact ui-center">
            <div class="panel-head centered-head">
              <div>
                <div class="section-kicker">문제 설정</div>
                <h2>문제 설정</h2>
              </div>
            </div>

            <div class="settings-grid ui-center">
              <label>
                <span>자료</span>
                <select id="quizMaterial"></select>
              </label>

              <label>
                <span>문제 수</span>
                <input id="quizCount" type="number" min="1" max="30" value="10">
              </label>

              <label>
                <span>객관식 비율</span>
                <div class="range-line">
                  <input id="mcqPercent" type="range" min="0" max="100" step="10" value="70">
                  <em id="mcqLabel">70%</em>
                </div>
              </label>

              <label>
                <span>난이도</span>
                <select id="difficulty">
                  <option value="mixed">혼합</option>
                  <option value="easy">쉬움</option>
                  <option value="normal">보통</option>
                  <option value="hard">어려움</option>
                </select>
              </label>
            </div>

            <div class="settings-footer centered-actions">
              <button id="generateQuiz" class="primary-btn">문제 생성</button>
            </div>
            <div id="quizStatus" class="status"></div>
          </section>

        </div>

        <section id="homeQuizSection" class="panel large study-block">
          <div class="panel-head study-heading">
            <div>
              <div class="section-kicker">문제 및 오답노트</div>
              <h2>문제 및 오답노트</h2>
            </div>
          </div>

          <form id="quizForm" class="quiz-stack hidden"></form>

          <div id="resultPanel" class="result-wrap empty study-content">
            생성된 문제가 여기에 표시된다.<br>
            채점 후 틀린 문제와 해설도 같은 영역에서 확인할 수 있다.
          </div>
        </section>

        <section id="homeFeedbackSection" class="panel large ui-center">
          <div class="panel-head centered-head">
            <div>
              <div class="section-kicker">피드백</div>
              <h2>피드백</h2>
            </div>
          </div>

          <div class="feedback-grid">
            <div class="feedback-box ui-center">
              <h3>취약 개념</h3>
              <div id="weakConcepts" class="simple-list empty ui-center">
                문제를 풀면 분석된다.
              </div>
            </div>

            <div class="feedback-box ui-center">
              <h3>개념 숙련도</h3>
              <div id="masteryList" class="simple-list empty ui-center">
                아직 분석 데이터가 없다.
              </div>
            </div>
          </div>

          <div class="feedback-note ui-center">
            틀린 문제 → 오류 분석 → 취약 개념 누적 → 복습
          </div>
        </section>

      </section>

      <section id="materialsView" class="view hidden">

        <section class="panel ui-center">
          <div class="panel-head centered-head">
            <div>
              <div class="section-kicker">자료</div>
              <h2>내 자료</h2>
            </div>
          </div>

          <div class="centered-actions">
            <label class="upload-chip" for="fileInput2">+ 자료 추가</label>
            <input id="fileInput2" hidden type="file" accept="image/*,.pdf,application/pdf">
          </div>

          <div id="materialsList" class="simple-list empty ui-center">
            자료가 없다.
          </div>
        </section>

        <div id="workspace" class="workspace hidden">

          <section class="panel ui-center">
            <div class="panel-head centered-head">
              <div>
                <div class="section-kicker">원본</div>
                <h2>자료 보기</h2>
                <p id="selectedFilename" class="filename"></p>
              </div>
            </div>
            <div id="preview" class="preview"></div>
          </section>

          <section class="panel">
            <div class="panel-head note-head">
              <div>
                <div class="section-kicker">요약 노트</div>
                <h2>AI 요약</h2>
              </div>
              <button id="analyzeBtn" class="primary-btn">AI 분석</button>
            </div>

            <div id="note" class="note empty study-content">
              자료를 선택하고 AI 분석을 눌러라.
            </div>
          </section>

        </div>

      </section>

    </main>

    <nav class="bottom-nav ui-center">
      <button class="bottom-tab active" data-target="home">홈</button>
      <button class="bottom-tab" data-target="materials">자료</button>
      <button class="bottom-tab" data-target="quiz">문제</button>
      <button class="bottom-tab" data-target="analysis">분석</button>
    </nav>

  </div>

  <script src="/static/app.js"></script>
</body>
</html>
